[Unit]
RequiresMountsFor=/data
AssertPathIsMountPoint=/data

[Service]
User=root
Environment=OASIS_ENV=/opt/ros/@ROS2_DISTRO@/setup.bash
Environment=OPENCV_LIB_DIR=@LIBDIR@
Environment=OPENCV_PYTHON_DIR=@OPENCV_PYTHON_DIR@
Environment=APRILTAG_LIB_DIR=@LIBDIR@
Environment=ROS_LOG_DIR=/data/log/oasis
# Upstream changes into OASIS_SRC/oasis_perception_cpp. BGSLibrary writes config
# relative to that directory, so it must be on the writable data partition.
Environment=OASIS_SRC=/data/oasis
ExecStartPre=@BASE_BINDIR@/mkdir -p /data/log/oasis /data/oasis/oasis_perception_cpp/config
